<!DOCTYPE html>
<html>
<head>
  <title>Money Agents - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 text-white min-h-screen p-6">
  <header class="bg-gradient-to-br from-emerald-500 to-emerald-700 p-6 rounded-2xl mb-6">
    <h1 class="text-3xl font-bold">🚀 Money Agents</h1>
    <p class="text-emerald-50">PrizePicks + The Odds API</p>
  </header>

  <div class="grid grid-cols-2 gap-6">
    <div class="bg-neutral-900 p-4 rounded-xl">
      <h2 class="text-xl font-bold mb-2">PrizePicks Picks</h2>
      <div id="pp-picks" class="text-sm text-neutral-400">Loading...</div>
    </div>
    
    <div class="bg-neutral-900 p-4 rounded-xl">
      <h2 class="text-xl font-bold mb-2">The Odds API</h2>
      <div id="odds-games" class="text-sm text-neutral-400">Loading...</div>
    </div>
  </div>

  <div class="mt-6 bg-neutral-900 p-4 rounded-xl">
    <h2 class="text-xl font-bold mb-2">All Picks</h2>
    <pre id="output" class="text-xs overflow-auto max-h-96">Loading...</pre>
  </div>

  <script>
    async function fetchData() {
      const res = await fetch('http://127.0.0.1:8010/scraper-proxy', {
        method: 'POST'
      });
      const data = await res.json();
      
      document.getElementById('pp-picks').textContent = 
        data.prizePicks ? `Got ${data.prizePicks.length} picks` : data.error || 'Error';
      
      document.getElementById('odds-games').textContent = 
        data.oddsApi ? `Got ${data.oddsApi.length} games` : 'No games';
      
      document.getElementById('output').textContent = JSON.stringify(data, null, 2);
    }
    
    fetchData();
    setInterval(fetchData, 30000);
  </script>
</body>
</html>
