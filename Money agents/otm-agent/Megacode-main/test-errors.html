<!DOCTYPE html>
<html>
<head>
    <title>Error Test</title>
    <script>
        // Catch all errors
        window.onerror = function(msg, url, line, col, error) {
            console.error('Global error:', {msg, url, line, col, error});
            document.getElementById('errors').innerHTML += `<div style="color:red">${msg} at ${url}:${line}:${col}</div>`;
            return false;
        };
        
        // Catch unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
            console.error('Unhandled rejection:', event.reason);
            document.getElementById('errors').innerHTML += `<div style="color:orange">Unhandled rejection: ${event.reason}</div>`;
        });
        
        // Test Monaco loading
        function testMonaco() {
            console.log('Testing Monaco...');
            
            // Configure Monaco
            window.require.config({ paths: { vs: '/monaco/vs' } });
            window.MonacoEnvironment = {
                getWorkerUrl: function () {
                    return `data:text/javascript;charset=utf-8,${encodeURIComponent(`
                        self.MonacoEnvironment = { baseUrl: '/monaco/' };
                        importScripts('/monaco/vs/base/worker/workerMain.js');
                    `)}`;
                }
            };
            
            // Load Monaco
            window.require(['vs/editor/editor.main'], function () {
                console.log('Monaco loaded successfully!');
                document.getElementById('status').innerHTML = '<div style="color:green">Monaco loaded successfully!</div>';
                
                // Test creating editor
                try {
                    const editor = monaco.editor.create(document.getElementById('editor'), {
                        value: '// Test Monaco Editor\nconsole.log("Hello!");',
                        language: 'javascript',
                        theme: 'vs-dark'
                    });
                    console.log('Editor created:', editor);
                    document.getElementById('status').innerHTML += '<div style="color:green">Editor created successfully!</div>';
                } catch (e) {
                    console.error('Failed to create editor:', e);
                    document.getElementById('status').innerHTML += `<div style="color:red">Failed to create editor: ${e.message}</div>`;
                }
            }, function (error) {
                console.error('Failed to load Monaco:', error);
                document.getElementById('status').innerHTML = `<div style="color:red">Failed to load Monaco: ${error}</div>`;
            });
        }
        
        // Load Monaco loader
        function loadMonaco() {
            if (window.require && window.require.config) {
                testMonaco();
                return;
            }
            
            const script = document.createElement('script');
            script.src = '/monaco/vs/loader.js';
            script.onload = testMonaco;
            script.onerror = function() {
                console.error('Failed to load Monaco loader');
                document.getElementById('status').innerHTML = '<div style="color:red">Failed to load Monaco loader.js</div>';
            };
            document.head.appendChild(script);
        }
        
        // Run when page loads
        window.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, testing Monaco...');
            loadMonaco();
        });
    </script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #editor { width: 100%; height: 300px; border: 1px solid #ccc; }
        #status, #errors { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Monaco Error Test</h1>
    <div id="status">Loading...</div>
    <div id="errors">No errors yet...</div>
    <div id="editor"></div>
</body>
</html>
